@let p = product();
<article class="group flex h-full min-w-0 flex-col" [attr.data-product-id]="p.id">
  <div class="relative">
    <a [routerLink]="['/catalog', p.id]" class="relative block aspect-[4/5] overflow-hidden rounded-2xl bg-white">
      <img [src]="p.images[0]" [alt]="p.name" loading="lazy" class="size-full object-contain p-3 transition duration-500 group-hover:scale-105" />
      @if (p.images.length > 1) {
        <img [src]="p.images[1]" alt="" loading="lazy" class="absolute inset-0 size-full bg-white object-contain p-3 opacity-0 transition duration-500 group-hover:opacity-100" />
      }
      <span class="absolute left-3 top-3 flex flex-col items-start gap-1">
        @if (discount() > 0) { <span class="rounded-full bg-rosewood px-2 py-0.5 text-xs font-medium text-white">−{{ discount() }}%</span> }
        @if (p.isNew) { <span class="rounded-full bg-ink px-2 py-0.5 text-xs font-medium text-cream">New</span> }
      </span>
    </a>
    <button type="button" (click)="favorites.toggle(p.id)" [attr.aria-pressed]="favorites.has(p.id)"
            [attr.aria-label]="favorites.has(p.id) ? 'Убрать из избранного' : 'Добавить в избранное'"
            class="absolute right-3 top-3 grid size-9 place-items-center rounded-full bg-white/95 shadow-sm transition hover:text-rosewood"
            [class.text-rosewood]="favorites.has(p.id)"><app-icon name="heart" class="size-5" [filled]="favorites.has(p.id)" /></button>
    <button type="button" (click)="preview.open(p)" [attr.aria-label]="'Предпросмотр: ' + p.name"
            class="quick-view-trigger absolute inset-x-3 bottom-3 hidden h-10 items-center justify-center gap-2 rounded-full border border-sand bg-white/95 text-xs font-medium opacity-0 shadow-sm transition hover:bg-cream group-hover:opacity-100 focus-visible:opacity-100 lg:flex">
      <app-icon name="eye" class="size-4" /> Быстрый просмотр
    </button>
  </div>
  <div class="mt-3 flex flex-1 flex-col">
    <p class="text-xs uppercase tracking-wide text-ink/50">{{ p.brand }}</p>
    <a [routerLink]="['/catalog', p.id]" class="mt-0.5 line-clamp-2 text-sm font-medium hover:text-rosewood">{{ p.name }}</a>
    <p class="mt-1 flex items-center gap-1 text-xs text-ink/60"><app-icon name="star" class="size-3.5 text-rosewood" [filled]="true" />{{ p.rating }} <span>({{ p.reviews }})</span></p>
    <div class="mt-2 flex flex-wrap items-baseline gap-x-2">
      <span class="font-semibold">{{ p.price | price }}</span>
      @if (p.oldPrice) { <span class="text-xs text-ink/40 line-through">{{ p.oldPrice | price }}</span> }
    </div>
    <div class="mt-auto pt-3"><app-cart-control [productId]="p.id" [productName]="p.name" /></div>
  </div>
</article>
